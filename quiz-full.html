<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>一屏全量小测 · Quiz Full</title>
<style>
  body { font-family: "Microsoft YaHei", sans-serif; background: #f2f4f8; color: #1a1d24;
         margin: 0; padding: 14px 36px; font-size: 15px; line-height: 1.45; }
  h1 { font-size: 20px; margin: 0 0 8px; color: #14417c; }
  .card { background: #fff; border: 1px solid #dde3ec; border-radius: 8px;
          padding: 8px 14px; margin-bottom: 10px; }
  .qhead { font-weight: 600; }
  .opts { margin-left: 20px; }
  .fill span { border-bottom: 2px dashed #999; padding: 0 50px; }
</style>
</head>
<body>
<h1>一屏全量小测（6 题一次答全）</h1>

<div class="card"><div class="qhead">1. 标准大气压下，水的沸点是多少摄氏度？</div>
  <div class="opts">A. 90℃　B. 100℃　C. 110℃　D. 120℃</div></div>

<div class="card"><div class="qhead">2. 我国现行宪法是下列哪一年颁布的？</div>
  <div class="opts">A. 1954年　B. 1975年　C. 1982年　D. 1999年</div></div>

<div class="card"><div class="qhead">3. 「光年」是用来衡量什么的单位？</div>
  <div class="opts">A. 时间　B. 速度　C. 长度　D. 亮度</div></div>

<div class="card"><div class="qhead">4. 声音在真空中不能传播。（判断）</div>
  <div class="opts">A. 正确　B. 错误</div></div>

<div class="card"><div class="qhead">5. 地球绕太阳公转一周约需 365 天。（判断）</div>
  <div class="opts">A. 正确　B. 错误</div></div>

<div class="card"><div class="qhead">6. 中国国歌《义勇军进行曲》的作曲者是谁？</div>
  <div class="opts">A. 聂耳　B. 冼星海　C. 田汉　D. 贺绿汀</div></div>

</body>
</html>
